name: Matter Labs
description: >-
  Matter Labs is the company behind ZKsync, a family of zero-knowledge (ZK) rollup Layer 2
  scaling solutions for Ethereum. Its flagship network, ZKsync Era, is an EVM-compatible ZK
  rollup that inherits Ethereum security while offering low fees and high throughput. For
  developers ZKsync Era exposes a public, Ethereum-compatible JSON-RPC API (the standard
  eth_* namespace) extended with a ZKsync-specific zks_* namespace covering L1 batches,
  L1<->L2 bridging, fee and gas-per-pubdata estimation, token discovery, and Merkle proofs,
  plus a WebSocket pub/sub surface. First-party SDKs ship for JavaScript/TypeScript
  (zksync-ethers), Python (zksync2), and Go (zksync2-go), alongside a zksync-cli developer
  tool and native account-abstraction support. Matter Labs also builds the ZK Stack for
  launching sovereign ZK chains. The company is backed by a16z.
